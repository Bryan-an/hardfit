# pnpm reads project settings from this file in pnpm 10. No `packages:` key needed for a single-package repo.
minimumReleaseAge: 1440
minimumReleaseAgeExclude: []
strictDepBuilds: true
# Native-binary builders allowlisted least-privilege (dev-only toolchain):
# esbuild = bundler used by Vite 8 and wrangler; workerd = the Workers
# runtime (wrangler); sharp (via miniflare) = libvips image bindings.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
