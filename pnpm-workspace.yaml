# pnpm reads project settings from this file in pnpm 10. No `packages:` key needed for a single-package repo.
minimumReleaseAge: 1440
minimumReleaseAgeExclude: []
strictDepBuilds: true
# Native-binary builders allowlisted least-privilege. All are wrangler's
# (e2e dev server) toolchain: esbuild = its bundler, workerd = the Workers
# runtime, sharp (via miniflare) = libvips image bindings.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
